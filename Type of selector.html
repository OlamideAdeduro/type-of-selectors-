<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>type of selector</title>
    <style>
        #p1{
            color: red;
            background-color: black;
        }
        .demo{
            color: teal; background-color: yellow;
        }
        *{
            color: blue;
            background-color: aliceblue;
        }
        h1,p{
            color: azure; background-color: bisque; 
        }
    </style>
</head>
<body>
    <p id="p1"> this is id selector </p>
    <p class="demo"> this is class selector</p>
    <p>this is a universal selector</p>
    <h1>this is universal selector</h1>
    <h2>hello</h2>
</body>
</html>
